org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental compilation is disabled because the project path
# contains spaces ("flutter app"), which breaks the Kotlin daemon's
# incremental cache files on Windows. Removing the spaces from the project
# path would allow re-enabling it for faster rebuilds.
kotlin.incremental=false
# Run Kotlin compilation inside the Gradle process instead of a shared
# Kotlin daemon: prevents the "Storage ... is already registered" cache
# collision when two builds (e.g. an IDE run and a CLI build) overlap on
# this project.
kotlin.compiler.execution.strategy=in-process
